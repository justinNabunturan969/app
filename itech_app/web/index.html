<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PUP-ITech Equipment Borrowing.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PUP-ITech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PUP-ITech Borrowing</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading splash that hides as soon as Flutter's first frame is ready.
    Mirrors the opening beat of the in-app launch loader (lib/screens/
    onboarding/launch_loader.dart): the amber wrench rises from below
    into the center of the same #08090B backdrop with an ease-out-back
    overshoot and the signature amber glow. When Flutter paints its first
    frame this fades out and LaunchLoader replays the full sequence —
    rise, glide left, typewriter app name — so a forced-logout reload is
    visually indistinguishable from a first launch.
  -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #08090B; }
    #boot {
      position: fixed; inset: 0;
      background: #08090B;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .25s ease-out;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot-wrench {
      width: 86px; height: 86px;
      filter:
        drop-shadow(0 0 18px rgba(255, 184, 0, 0.30))
        drop-shadow(0 0 36px rgba(255, 184, 0, 0.16));
      /* Rise from below + scale up, matching LaunchLoader's first phase:
         begin Alignment(0, 2.15) scale .72 -> center scale 1.0,
         Curves.easeOutBack ≈ cubic-bezier(.34, 1.56, .64, 1). */
      animation:
        boot-rise 0.95s cubic-bezier(.34, 1.56, .64, 1) both,
        boot-glow 1.6s ease-in-out 0.95s infinite alternate;
    }
    @keyframes boot-rise {
      from { transform: translateY(46vh) scale(0.72); opacity: 0; }
      55%  { opacity: 1; }
      to   { transform: translateY(0) scale(1); opacity: 1; }
    }
    @keyframes boot-glow {
      from {
        filter: drop-shadow(0 0 14px rgba(255, 184, 0, 0.22));
      }
      to {
        filter: drop-shadow(0 0 28px rgba(255, 184, 0, 0.45));
      }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-wrench { animation: none; }
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true">
    <!-- Same glyph as LaunchWrenchIcon: Material "build" icon, cyberAmber -->
    <svg id="boot-wrench" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path fill="#FFB800" d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.8 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.2-1.4z"/>
    </svg>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Flutter web builds from older releases registered an app-shell service
    worker. Those workers can keep an already-installed app on an obsolete
    JavaScript bundle indefinitely. We intentionally do not use offline
    caching: each launch should load the current production build instead.
  -->
  <!--
    CSP NOTE: the three inline boot scripts below are hash-pinned in
    vercel.json (script-src 'sha256-...'), not allowed via 'unsafe-inline'.
    Change one character inside any of them and the browser silently refuses
    to run it, so the app freezes on the boot splash — which looks exactly
    like a deploy failure. To re-pin after editing, recompute each script's
    sha256 (base64) over its text with CRLF normalized to LF; the browser
    hashes the normalized text, so a raw-file digest will not match. Then
    update the three 'sha256-...' values in vercel.json. Keep a bare script
    opening tag out of this comment: a regex that extracts inline scripts
    would match it and throw off every hash computed from this file.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        return Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        }));
      }).then(function () {
        return caches.keys();
      }).then(function (keys) {
        return Promise.all(keys.map(function (key) {
          return caches.delete(key);
        }));
      }).catch(function (error) {
        // A cache cleanup failure must never prevent the app from starting.
        console.warn('Unable to clear an old app cache:', error);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Microphone permission helper for voice search.
    The browser's `navigator.mediaDevices.getUserMedia({ audio: true })`
    request is the most consistent way to surface a microphone
    permission prompt on mobile web — iOS Safari and Chrome on Android
    both render a full-screen, unmistakable dialog. The Web Speech API
    (`webkitSpeechRecognition`) is what the `speech_to_text` plugin
    actually uses, but its permission prompt is easy to miss on a
    phone and there is no clean "how do I re-enable this" path.
    Requesting via `getUserMedia` first, then handing off to
    `speech_to_text`, gives us both a clear prompt and a recoverable
    failure mode. Exposed on `window.__pupRequestMic` so the Dart side
    can call it through `dart:js_interop`.
  -->
  <script>
    (function () {
      window.__pupRequestMic = function () {
        return new Promise(function (resolve) {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            resolve({ granted: false, reason: 'unsupported' });
            return;
          }
          // Some browsers (older iOS Safari over plain HTTP) won't even
          // expose `mediaDevices`. A secure context is required for
          // getUserMedia to actually prompt the user.
          if (typeof window.isSecureContext === 'boolean' && !window.isSecureContext) {
            resolve({ granted: false, reason: 'insecure' });
            return;
          }
          navigator.mediaDevices
            .getUserMedia({ audio: true })
            .then(function (stream) {
              // We only wanted permission — stop every track immediately
              // so the browser's "mic is on" indicator goes away.
              try {
                stream.getTracks().forEach(function (track) { track.stop(); });
              } catch (_) { /* best effort */ }
              resolve({ granted: true });
            })
            .catch(function (error) {
              var name = (error && error.name) || '';
              if (name === 'NotAllowedError' || name === 'PermissionDeniedError' || name === 'SecurityError') {
                resolve({ granted: false, reason: 'denied' });
              } else if (name === 'NotFoundError' || name === 'OverconstrainedError') {
                resolve({ granted: false, reason: 'no_microphone' });
              } else {
                resolve({ granted: false, reason: 'error', name: name });
              }
            });
        });
      };
    })();
  </script>

  <!--
    Once Flutter has rendered its first frame, fade out the splash.
    Using a MutationObserver on <flt-glass-pane> is the most reliable
    hook that works across all Flutter web versions.
  -->
  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      function hide() {
        boot.classList.add('hide');
        setTimeout(function () { boot.remove(); }, 300);
      }
      var tryHide = function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) hide();
      };
      var obs = new MutationObserver(tryHide);
      obs.observe(document.body, { childList: true, subtree: true });
      // Hard fallback: hide after 8s no matter what, so the splash
      // never gets stuck.
      setTimeout(hide, 8000);
    })();
  </script>
</body>
</html>
