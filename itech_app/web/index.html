<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PUP-ITech Equipment Borrowing.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PUP-ITech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PUP-ITech Borrowing</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading splash that hides as soon as Flutter's first frame is ready.
    Gives the user a branded "loading…" instead of a blank white page
    while canvaskit.wasm and main.dart.js download.
  -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #08090B; }
    #boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #FFFFFF; text-align: center;
      transition: opacity .25s ease-out;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .mark {
      width: 124px; height: 124px;
      animation: mark-zoom 1.35s cubic-bezier(.22, 1, .36, 1) both;
    }
    #boot .mark svg {
      width: 100%; height: 100%;
      display: block;
    }
    @keyframes mark-zoom {
      from { transform: scale(.35); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="mark" aria-label="PUP-ITech">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 124 124" fill="none" aria-hidden="true">
        <defs>
          <linearGradient id="bootWrenchFill" x1="18" y1="16" x2="98" y2="98" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FFD054"/>
            <stop offset="0.55" stop-color="#FFB800"/>
            <stop offset="1" stop-color="#E6A600"/>
          </linearGradient>
          <filter id="bootWrenchGlow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#FFB800" flood-opacity="0.35"/>
          </filter>
        </defs>
        <g transform="translate(62 62) rotate(-45) translate(-62 -62)" filter="url(#bootWrenchGlow)">
          <path fill="url(#bootWrenchFill)" stroke="rgba(255,255,255,0.22)" stroke-width="2.2" stroke-linejoin="round"
            d="M22.3 42.2C18.4 34.8 22.8 27.2 30.6 24.1L38.8 32.3L36.2 34.9L41.8 40.5L44.4 37.9L96.7 90.2C99.4 92.9 99.4 97.1 96.7 99.8C94 102.5 89.8 102.5 87.1 99.8L34.8 47.5L32.2 50.1L26.6 44.5Z"/>
          <rect x="36" y="28" width="10" height="62" rx="5" fill="rgba(255,255,255,0.16)"/>
        </g>
      </svg>
    </div>
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Flutter web builds from older releases registered an app-shell service
    worker. Those workers can keep an already-installed app on an obsolete
    JavaScript bundle indefinitely. We intentionally do not use offline
    caching: each launch should load the current production build instead.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        return Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        }));
      }).then(function () {
        return caches.keys();
      }).then(function (keys) {
        return Promise.all(keys.map(function (key) {
          return caches.delete(key);
        }));
      }).catch(function (error) {
        // A cache cleanup failure must never prevent the app from starting.
        console.warn('Unable to clear an old app cache:', error);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Once Flutter has rendered its first frame, fade out the splash.
    Using a MutationObserver on <flt-glass-pane> is the most reliable
    hook that works across all Flutter web versions.
  -->
  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      function hide() {
        boot.classList.add('hide');
        setTimeout(function () { boot.remove(); }, 300);
      }
      var tryHide = function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) hide();
      };
      var obs = new MutationObserver(tryHide);
      obs.observe(document.body, { childList: true, subtree: true });
      // Hard fallback: hide after 8s no matter what, so the splash
      // never gets stuck.
      setTimeout(hide, 8000);
    })();
  </script>
</body>
</html>
