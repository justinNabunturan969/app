<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="PUP-ITech Equipment Borrowing.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PUP-ITech">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PUP-ITech Borrowing</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Loading splash that hides as soon as Flutter's first frame is ready.
    Gives the user a branded "loading…" instead of a blank white page
    while canvaskit.wasm and main.dart.js download.
  -->
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #08090B; }
    #boot {
      position: fixed; inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08090B;
      transition: opacity .25s ease-out;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .mark {
      width: 112px;
      height: 112px;
      background: #FFB800;
      -webkit-mask: url('icons/Icon-192.png') center / contain no-repeat;
      mask: url('icons/Icon-192.png') center / contain no-repeat;
      filter: drop-shadow(0 0 18px rgba(255, 184, 0, .30));
      animation: mark-zoom 1.35s cubic-bezier(.22, 1, .36, 1) both;
    }
    @keyframes mark-zoom {
      0% { transform: scale(.12); opacity: 0; }
      72% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><div class="mark"></div></div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!--
    Flutter web builds from older releases registered an app-shell service
    worker. Those workers can keep an already-installed app on an obsolete
    JavaScript bundle indefinitely. We intentionally do not use offline
    caching: each launch should load the current production build instead.
  -->
  <script>
    (function () {
      if (!('serviceWorker' in navigator)) return;

      navigator.serviceWorker.getRegistrations().then(function (registrations) {
        return Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        }));
      }).then(function () {
        return caches.keys();
      }).then(function (keys) {
        return Promise.all(keys.map(function (key) {
          return caches.delete(key);
        }));
      }).catch(function (error) {
        // A cache cleanup failure must never prevent the app from starting.
        console.warn('Unable to clear an old app cache:', error);
      });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>

  <!--
    Once Flutter has rendered its first frame, fade out the splash.
    Using a MutationObserver on <flt-glass-pane> is the most reliable
    hook that works across all Flutter web versions.
  -->
  <script>
    (function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      function hide() {
        boot.classList.add('hide');
        setTimeout(function () { boot.remove(); }, 300);
      }
      var tryHide = function () {
        if (document.querySelector('flt-glass-pane, flutter-view')) hide();
      };
      var obs = new MutationObserver(tryHide);
      obs.observe(document.body, { childList: true, subtree: true });
      // Hard fallback: hide after 8s no matter what, so the splash
      // never gets stuck.
      setTimeout(hide, 8000);
    })();
  </script>
</body>
</html>
